[package]
name = "one-brain"
version = "0.2.0"
edition = "2021"
build = "build.rs"
license = "LicenseRef-Slint-Royalty-Free-2.0"
description = "ONE BRAIN private multi-model AI client"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "one-brain"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"

[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { version = "1.19.1", features = ["backend-winit", "renderer-femtovg", "compat-1-18"] }

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.19.1", default-features = false, features = ["backend-android-activity-06", "renderer-skia", "compat-1-18"] }

[target.'cfg(windows)'.dependencies]
notify-rust = "4"
enigo = "0.6.1"
sysinfo = "0.30.13"

[build-dependencies]
slint-build = "1.19.1"

[package.metadata.android]
package = "com.tuckerlowson.onebrain"
label = "ONE BRAIN"
min_sdk_version = 26
target_sdk_version = 35

[[package.metadata.android.application.activity]]
name = "android.app.NativeActivity"

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "one_brain"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]
