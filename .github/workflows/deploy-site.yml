name: Deploy ONE BRAIN website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "functions/**"
      - "wrangler.toml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website --project-name=one-brain-site --branch=${{ github.ref_name }}
