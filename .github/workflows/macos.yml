name: ONE BRAIN macOS app

on:
  workflow_dispatch:
  push:
    branches: ["feature/android-capacitor"]
    paths:
      - "desktop/**"
      - ".github/workflows/macos.yml"

permissions:
  contents: write

jobs:
  macos-desktop:
    name: Build macOS (Apple Silicon + Intel)
    runs-on: macos-latest
    env:
      VITE_BUILD_NUMBER: ${{ github.run_number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Set development build version
        run: npm version 0.7.${{ github.run_number }} --no-git-tag-version
      - name: Build React interface
        env:
          VITE_APP_VERSION: 0.7.${{ github.run_number }}
        run: npm run build
      - name: Package and publish macOS installers
        run: npx electron-builder --mac dmg zip --arm64 --x64 --publish always
      - name: Upload macOS installers to workflow
        uses: actions/upload-artifact@v4
        with:
          name: ONE-BRAIN-MACOS-${{ github.run_number }}
          path: |
            desktop/dist-installer/*.dmg
            desktop/dist-installer/*.zip
          if-no-files-found: error
          retention-days: 30
