name: ONE BRAIN Android APK and updater

on:
  workflow_dispatch:
  push:
    branches: [main, "feature/android-capacitor"]
    paths:
      - "desktop/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Install dependencies
        run: npm install
      - name: Assign unique Android app version
        id: appversion
        run: |
          VERSION="0.7.${GITHUB_RUN_NUMBER}"
          npm version "$VERSION" --no-git-tag-version
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build React app
        env:
          VITE_BUILD_NUMBER: ${{ github.run_number }}
          VITE_APP_VERSION: 0.7.${{ github.run_number }}
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Install native Android updater
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("android/app/src/main")
          main = next(root.rglob("MainActivity.java"), None) or next(root.rglob("MainActivity.kt"), None)
          if main is None:
              raise SystemExit("Capacitor MainActivity source was not found.")
          source = main.read_text()
          match = re.search(r"^\s*package\s+([\w.]+)", source, re.M)
          if not match:
              raise SystemExit("Could not determine Android application package.")
          package = match.group(1)
          plugin = Path("android-template/app/src/main/java/com/tuckerlowson/onebrain/ApkInstallerPlugin.java").read_text()
          plugin = re.sub(r"^package [^;]+;", "package " + package + ";", plugin, count=1, flags=re.M)
          (main.parent / "ApkInstallerPlugin.java").write_text(plugin)
          if main.suffix == ".java":
              activity = Path("android-template/app/src/main/java/com/tuckerlowson/onebrain/MainActivity.java").read_text()
              activity = re.sub(r"^package [^;]+;", "package " + package + ";", activity, count=1, flags=re.M)
          else:
              activity = Path("android-template/app/src/main/java/com/tuckerlowson/onebrain/MainActivity.kt").read_text()
              activity = re.sub(r"^package [^\n]+", "package " + package, activity, count=1, flags=re.M)
          main.write_text(activity)
          xml = Path("android-template/app/src/main/res/xml/onebrain_file_paths.xml")
          (root / "res/xml").mkdir(parents=True, exist_ok=True)
          (root / "res/xml/onebrain_file_paths.xml").write_text(xml.read_text())
          manifest = root / "AndroidManifest.xml"
          text = manifest.read_text()
          if "REQUEST_INSTALL_PACKAGES" not in text:
              text = text.replace("<application", '<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <application', 1)
          if "onebrain.fileprovider" not in text:
              provider = '''        <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/onebrain_file_paths" />
                  </provider>
          '''
              text = text.replace("</application>", provider + "    </application>", 1)
          manifest.write_text(text)
          gradle = Path("android/app/build.gradle")
          text = gradle.read_text()
          import os
          run = os.environ.get("GITHUB_RUN_NUMBER", "1")
          text = re.sub(r"versionCode\s+\d+", "versionCode " + run, text, count=1)
          text = text.replace('versionName "1.0"', 'versionName "' + os.environ.get("APP_VERSION", "0.6.0") + '"', 1)
          if all(os.environ.get(k) for k in ("ANDROID_KEYSTORE_BASE64", "ANDROID_KEYSTORE_PASSWORD", "ANDROID_KEY_ALIAS", "ANDROID_KEY_PASSWORD")):
              signing = '''    signingConfigs {
                      release {
                          storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                          storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                          keyAlias System.getenv("ANDROID_KEY_ALIAS")
                          keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                      }
                  }
          '''
              text = text.replace("    buildTypes {", signing + "    buildTypes {", 1)
              text = text.replace("        release {", "        release {\n            signingConfig signingConfigs.release", 1)
          gradle.write_text(text)
          PY
        env:
          APP_VERSION: ${{ steps.appversion.outputs.version }}
      - name: Sync web app into Android
        run: npx cap sync android
      - name: Prepare permanent signing key
        if: env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release.keystore
          echo "ANDROID_KEYSTORE_PATH=$PWD/android/release.keystore" >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != ''
        working-directory: desktop/android
        run: ./gradlew assembleRelease
      - name: Build unsigned-key debug APK for testing
        if: env.ANDROID_KEYSTORE_BASE64 == '' || env.ANDROID_KEYSTORE_PASSWORD == '' || env.ANDROID_KEY_ALIAS == '' || env.ANDROID_KEY_PASSWORD == ''
        working-directory: desktop/android
        run: ./gradlew assembleDebug
      - name: Upload test APK artifact
        if: env.ANDROID_KEYSTORE_BASE64 == '' || env.ANDROID_KEYSTORE_PASSWORD == '' || env.ANDROID_KEY_ALIAS == '' || env.ANDROID_KEY_PASSWORD == ''
        uses: actions/upload-artifact@v4
        with:
          name: ONE-BRAIN-ANDROID-UNSIGNED-UPDATE-NOT-ENABLED-${{ github.run_number }}
          path: desktop/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Name signed Android APK
        if: env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != ''
        run: cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/ONE-BRAIN-ANDROID-v${{ steps.appversion.outputs.version }}.apk
      - name: Publish signed Android release
        if: env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ steps.appversion.outputs.version }}
          name: ONE BRAIN Android v${{ steps.appversion.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: desktop/android/app/build/outputs/apk/release/ONE-BRAIN-ANDROID-v${{ steps.appversion.outputs.version }}.apk
