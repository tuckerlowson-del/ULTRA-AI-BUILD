name: ONE BRAIN macOS app

on:
  workflow_dispatch:
  push:
    branches: ["feature/android-capacitor"]
    paths:
      - "desktop/**"
      - ".github/workflows/macos.yml"

permissions:
  contents: read

jobs:
  macos-desktop:
    name: Build macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-13
            arch: x64
    env:
      VITE_BUILD_NUMBER: ${{ github.run_number }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Set development build version
        run: npm version 0.7.${{ github.run_number }} --no-git-tag-version
      - name: Build React interface
        env:
          VITE_APP_VERSION: 0.7.${{ github.run_number }}
        run: npm run build
      - name: Package macOS app
        run: npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never
      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: ONE-BRAIN-MACOS-${{ matrix.arch }}-${{ github.run_number }}
          path:
            desktop/dist-installer/*.dmg
            desktop/dist-installer/*.zip
          if-no-files-found: error
          retention-days: 30
