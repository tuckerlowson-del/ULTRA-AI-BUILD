name: ONE BRAIN Android APK and updater

on:
  workflow_dispatch:
  push:
    branches: [main, "feature/android-capacitor"]
    paths:
      - "desktop/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Install dependencies
        run: npm install
      - name: Assign unique Android app version
        id: appversion
        run: |
          VERSION="0.6.${GITHUB_RUN_NUMBER}"
          npm version "$VERSION" --no-git-tag-version
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build React app
        env:
          VITE_BUILD_NUMBER: ${{ github.run_number }}
          VITE_APP_VERSION: ${{ steps.appversion.outputs.version }}
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Install native Android updater
        run: |
          mkdir -p android/app/src/main/java/com/tuckerlowson/onebrain android/app/src/main/res/xml
          cp android-template/app/src/main/java/com/tuckerlowson/onebrain/ApkInstallerPlugin.java android/app/src/main/java/com/tuckerlowson/onebrain/
          cp android-template/app/src/main/java/com/tuckerlowson/onebrain/MainActivity.java android/app/src/main/java/com/tuckerlowson/onebrain/
          cp android-template/app/src/main/res/xml/onebrain_file_paths.xml android/app/src/main/res/xml/
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          s=s.replace('<application', '<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\\n    <application', 1)
          provider='''        <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/onebrain_file_paths" />
                  </provider>
          '''
          s=s.replace('</application>', provider + '    </application>', 1)
          p.write_text(s)
          p=Path("android/app/build.gradle")
          s=p.read_text()
          import os
          run=os.environ.get("GITHUB_RUN_NUMBER","1")
          s=s.replace("versionCode 1", "versionCode " + run, 1)
          s=s.replace('versionName "1.0"', 'versionName "' + os.environ.get("APP_VERSION","0.6.0") + '"', 1)
          if all(os.environ.get(k) for k in ("ANDROID_KEYSTORE_BASE64","ANDROID_KEYSTORE_PASSWORD","ANDROID_KEY_ALIAS","ANDROID_KEY_PASSWORD")):
              signing='''    signingConfigs {
                      release {
                          storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                          storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                          keyAlias System.getenv("ANDROID_KEY_ALIAS")
                          keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                      }
                  }
          '''
              s=s.replace("    buildTypes {", signing + "    buildTypes {", 1)
              s=s.replace("        release {", "        release {\\n            signingConfig signingConfigs.release", 1)
          p.write_text(s)
          PY
        env:
          APP_VERSION: ${{ steps.appversion.outputs.version }}
      - name: Sync web app into Android
        run: npx cap sync android
      - name: Prepare permanent signing key
        if: env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release.keystore
          echo "ANDROID_KEYSTORE_PATH=$PWD/android/release.keystore" >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != ''
        working-directory: desktop/android
        run: ./gradlew assembleRelease
      - name: Build unsigned-key debug APK for testing
        if: env.ANDROID_KEYSTORE_BASE64 == '' || env.ANDROID_KEYSTORE_PASSWORD == '' || env.ANDROID_KEY_ALIAS == '' || env.ANDROID_KEY_PASSWORD == ''
        working-directory: desktop/android
        run: ./gradlew assembleDebug
      - name: Upload test APK artifact
        if: env.ANDROID_KEYSTORE_BASE64 == '' || env.ANDROID_KEYSTORE_PASSWORD == '' || env.ANDROID_KEY_ALIAS == '' || env.ANDROID_KEY_PASSWORD == ''
        uses: actions/upload-artifact@v4
        with:
          name: ONE-BRAIN-ANDROID-UNSIGNED-UPDATE-NOT-ENABLED-${{ github.run_number }}
          path: desktop/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Name signed Android APK
        if: env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != ''
        run: cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/ONE-BRAIN-ANDROID-v${{ steps.appversion.outputs.version }}.apk
      - name: Publish signed Android release
        if: env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ steps.appversion.outputs.version }}
          name: ONE BRAIN Android v${{ steps.appversion.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: desktop/android/app/build/outputs/apk/release/ONE-BRAIN-ANDROID-v${{ steps.appversion.outputs.version }}.apk
